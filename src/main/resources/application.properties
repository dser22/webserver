spring.application.name=jts

# DATABASE 연결 설정
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# DB연결 권한 설정
spring.datasource.url=jdbc:mysql://localhost/dbtest?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=smart

# JPA 사용설정
# JPA와 Hibernate 설정
spring.jpa.database = mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.JBossAppServerJtaPlatform
spring.jpa.hibernate.ddl-auto=update


